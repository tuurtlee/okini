<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OKINI - 404 Not Found</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #121212;
        color: white;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #bg-aura {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background-color: #1db954;
        filter: blur(80px) brightness(0.2);
        transform: scale(1.2);
        pointer-events: none;
      }
      h1 {
        font-size: 24px;
        margin-top: 10px;
        margin-bottom: 20px;
        text-align: center;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      #track-card {
        background: #282828;
        padding: 40px 20px;
        border-radius: 15px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        text-align: center;
        border: 1px solid transparent;
      }
      .error-icon {
        font-size: 60px;
        color: #1db954;
        margin-bottom: 20px;
        opacity: 0.8;
      }
      h2 {
        font-size: 24px;
        margin-top: 0;
        margin-bottom: 10px;
      }
      p {
        color: #b3b3b3;
        font-size: 14px;
        margin-bottom: 30px;
        line-height: 1.6;
      }
      a.action-btn {
        display: inline-block;
        background-color: #1db954;
        color: white;
        text-decoration: none;
        padding: 14px 28px;
        font-weight: bold;
        border-radius: 30px;
        transition: 0.3s;
        font-size: 15px;
        box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
      }
      a.action-btn:hover {
        background-color: #1ed760;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="bg-aura"></div>
    <h1>O K I N I</h1>
    <div id="track-card">
      <i class="fa-solid fa-compact-disc error-icon"></i>
      <h2>404 Not Found</h2>
      <p>お探しのページやプレイリストは<br />見つかりませんでした。</p>
      <a href="/main/" class="action-btn"> ホームへ戻る </a>
    </div>
  </body>
</html>
